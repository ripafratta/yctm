[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yctm"
version = "0.1.0"
description = "YouTube Channel Transcript Monitor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "youtube-transcript-api>=1.0",
]

[project.scripts]
yctm = "yctm.cli.app:app"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
